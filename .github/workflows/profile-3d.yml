name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *" # Runs daily at 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-isometric-contribution-calendar
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run generator tests
        run: python -m unittest tests/test_generate_isometric_contrib.py

      - name: Generate isometric contribution calendar
        run: |
          python scripts/generate_isometric_contrib.py \
            --username climp-hub \
            --output profile-3d-contrib/profile-isometric-contrib.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-isometric-contrib.svg
          git commit -m "chore: update isometric contribution calendar [skip ci]" || exit 0
          git push
